<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <a class="skip-link" href="#main">skip to content</a>

  <div class="wrap">
    <header class="site-header">
      <a class="site-title" href="{{ "/" | relative_url }}" aria-label="{{ site.title | escape }}">
        <span class="mark" aria-hidden="true">g</span><span aria-hidden="true">{{ site.title | replace: ' ', '_' }}</span>
      </a>
      <nav class="site-nav" aria-label="site">
        {% if site.bandcamp_username %}<a href="https://{{ site.bandcamp_username }}.bandcamp.com/">bandcamp</a>{% endif %}
        {% if site.email %}<a href="mailto:{{ site.email | encode_email }}">email</a>{% endif %}
        <a href="{{ "/feed.xml" | relative_url }}">rss</a>
      </nav>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>{{ site.author }}_&copy;_{{ 'now' | date: "%Y" }}</span>
      <a href="#main">top_&uarr;</a>
    </footer>
  </div>
</body>
</html>
